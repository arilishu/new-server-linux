# /etc/nginx/snippets/security-headers.conf — cabeceras de seguridad comunes. Los valores salen de los map de
# /etc/nginx/conf.d/security-headers.conf: cada una se agrega solo si la app
# de atrás no la mandó ya (un add_header con valor vacío no se envía), así no
# se duplica ni se pisa una más estricta que mande la app.
#
# Ya está incluido a nivel http, así que lo heredan todos los sitios. PERO un
# server o location que tenga su propio add_header deja de heredar los de
# arriba (regla de nginx), y ahí hay que incluir este archivo a mano:
#     include snippets/security-headers.conf;
add_header Strict-Transport-Security $sec_hsts always;
add_header X-Content-Type-Options $sec_xcto always;
add_header X-Frame-Options $sec_xfo always;
add_header Referrer-Policy $sec_referrer always;
add_header Permissions-Policy $sec_permissions always;
add_header Content-Security-Policy $sec_csp always;
