# Plantilla: app propia (Node/Next/Python) escuchando en 127.0.0.1:PUERTO.
#
#   sudo cp app.example.conf /etc/nginx/sites-available/app.example.com
#   (reemplazar app.example.com, PUERTO y el certificado)
#   sudo ln -sf /etc/nginx/sites-available/app.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reglas (PLAYBOOK.md, pasos 8 y 9):
#   - El registro DNS va PROXIED en Cloudflare: el server solo acepta 80/443 desde
#     Cloudflare. Un subdominio de un solo nivel (app-foo.dominio, no app.foo.dominio):
#     el Universal SSL de Cloudflare no cubre terceros niveles.
#   - Certificado por DNS-01 (comodín del dominio o propio), nunca `certbot --nginx`.
#   - $remote_addr ya es la IP real del visitante (conf.d/cloudflare-realip.conf).
#   - Las cabeceras de seguridad se heredan solas. Si agregás CUALQUIER add_header
#     en este server o en un location, incluí ahí snippets/security-headers.conf.
#   - Hostname literal en el redirect, no $host (si no, es un redirector abierto).

server {
    listen 80;
    server_name app.example.com;
    return 301 https://app.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.com;

    ssl_certificate /etc/letsencrypt/live/example-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Límite de subida: chico por defecto, abrir por location si hace falta.
    client_max_body_size 1m;

    # El health lo consultan los scripts por loopback; afuera no hace falta.
    location = /health { return 404; }

    location / {
        proxy_pass http://127.0.0.1:PUERTO;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (Next dev, n8n, etc.):
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
