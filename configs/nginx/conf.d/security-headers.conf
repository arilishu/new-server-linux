# /etc/nginx/conf.d/security-headers.conf — cabeceras de seguridad para todos los sitios.
# Detalle y por qué de cada valor: PLAYBOOK.md, paso 9.
#
# Cada map devuelve el valor por defecto si la app no mandó esa cabecera, y
# vacío si ya la mandó (nginx no envía un add_header vacío).

# HSTS: en las zonas de Cloudflare con HSTS activado, Cloudflare la reemplaza
# por la suya; esta vale para lo que pasa sin ese ajuste.
map $upstream_http_strict_transport_security $sec_hsts {
    ""      "max-age=31536000";
    default "";
}
map $upstream_http_x_content_type_options $sec_xcto {
    ""      "nosniff";
    default "";
}
# SAMEORIGIN y no DENY: hay apps que muestran sus propios PDFs en un iframe, y
# el editor de Elementor/el personalizador de WordPress usan iframes del mismo
# origen. Una app que quiera DENY lo manda ella y este map no lo pisa.
map $upstream_http_x_frame_options $sec_xfo {
    ""      "SAMEORIGIN";
    default "";
}
map $upstream_http_referrer_policy $sec_referrer {
    ""      "strict-origin-when-cross-origin";
    default "";
}
# Un sitio que usa micrófono/cámara/ubicación se agrega acá con su excepción
# (ej.: una app con órdenes por voz → microphone=(self)). `payment` no se toca:
# los iframes de PayPal, Mercado Pago y Rebill pueden usar la Payment Request API
# (Google Pay / Apple Pay) en tiendas y donaciones.
map $host $sec_permissions_default {
    default            "camera=(), microphone=(), geolocation=()";
    # app-con-voz.example.com "camera=(), microphone=(self), geolocation=()";
}
map $upstream_http_permissions_policy $sec_permissions {
    ""      $sec_permissions_default;
    default "";
}
# CSP base, segura para cualquier sitio: no limita de dónde salen scripts ni
# estilos (eso es por sitio y hay que probarlo en Report-Only), pero sí cierra
# clickjacking (frame-ancestors), el secuestro de <base> y sube a https lo que
# se pida por http. Solo si la app no trae su propia CSP.
# Sin object-src 'none' a propósito: el bloque "Archivo" de WordPress muestra
# la vista previa del PDF con <object>, y la quitaría.
map $upstream_http_content_security_policy $sec_csp {
    ""      "upgrade-insecure-requests; frame-ancestors 'self'; base-uri 'self'";
    default "";
}

include /etc/nginx/snippets/security-headers.conf;

# Qué tecnología y versión hay atrás (PHP/8.3, Next.js, Express): no se le
# dice a nadie. Un server/location con su propio proxy_hide_header deja de
# heredar este: ahí hay que repetirlo.
proxy_hide_header X-Powered-By;
