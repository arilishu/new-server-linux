; Opcache para un WordPress grande (WooCommerce + Elementor + tema premium: ~18k archivos PHP).
; Con el default de la imagen (128 MB / 4000 archivos) estaba lleno al 100%. Ver si hace
; falta: docker exec SITIO-wp php -r "print_r(opcache_get_status(false)['memory_usage']);"
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.revalidate_freq=2
