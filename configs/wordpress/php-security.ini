; Endurecimiento de PHP para WordPress. Se carga último (zzz-) para que nada lo pise.
;
; session.upload_progress: WordPress no lo usa, y fue la vía de un RCE de mod_php
; (CVE-2026-109619, aviso del 2026-10-21). Apagarlo no reemplaza al parche.
session.upload_progress.enabled = 0
; No anunciar la versión de PHP (X-Powered-By). nginx también la oculta.
expose_php = Off
; Subidas: imágenes de hasta 3 MB (pedido del dueño de los sitios; también achica
; la superficie de los ataques por cuerpo grande). Alinear con client_max_body_size.
upload_max_filesize = 3M
post_max_size = 8M
