# Endurecimiento a nivel Apache dentro del contenedor de WordPress.
# Se carga desde /etc/apache2/conf-enabled. Solo control de acceso (mod_authz_core, ya activo).

# 1) No ejecutar ni servir PHP subido a la carpeta de medios.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(?:php|phtml|php[0-9]|phps|pht)$">
        Require all denied
    </FilesMatch>
</Directory>

# 2) Ocultar archivos que delatan la versión o la config de WordPress.
<Files "readme.html">
    Require all denied
</Files>
<Files "license.txt">
    Require all denied
</Files>
<Files "wp-config-sample.php">
    Require all denied
</Files>

# 3) XML-RPC cerrado: vector de fuerza bruta y de pingback contra terceros. Abrirlo solo
#    si algo lo usa de verdad (la app móvil de WordPress, Jetpack).
<Files "xmlrpc.php">
    Require all denied
</Files>

# 4) Nunca servir por URL archivos de trabajo si se colaran en el docroot.
<FilesMatch "\.(?:log|sql|bak|old|orig|save|swp|dist|inc)$">
    Require all denied
</FilesMatch>
