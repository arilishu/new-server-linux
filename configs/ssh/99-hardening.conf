# /etc/ssh/sshd_config.d/99-hardening.conf
#
# Instalar con:  envsubst '${SSH_PORT}' < 99-hardening.conf | sudo tee /etc/ssh/sshd_config.d/99-hardening.conf
#
# OJO: sshd se queda con la PRIMERA aparición de cada opción, y los archivos de
# sshd_config.d/ se leen antes que el resto de sshd_config (por el Include del
# principio). Por eso todo lo importante va acá y no editando sshd_config.
# Verificar SIEMPRE con `sudo sshd -T`, no leyendo los archivos.

Port ${SSH_PORT}
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
MaxAuthTries 3
X11Forwarding no
